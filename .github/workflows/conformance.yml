name: Proof-aware test reuse conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CROSS_PROJECT_REQUIRED_GATES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Remote formatting assist
        run: gofmt -w $(git ls-files '*.go')
      - name: Export remote formatting patch
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/gofmt.patch"
      - name: Upload remote formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-gofmt-patch-${{ github.sha }}
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: error
      - name: Verify Go 1.27
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"
      - name: Verify vet
        run: go vet ./...
      - name: Compile engine archive
        run: scripts/measure-stage.sh compile "$RUNNER_TEMP/stage-metrics/compile.json" go build -buildmode=archive -trimpath -o "$RUNNER_TEMP/gooo-proof-aware-test-reuse-engine.a" ./internal/engine
      - name: Build evaluator binary
        run: scripts/measure-stage.sh build "$RUNNER_TEMP/stage-metrics/build.json" go build -trimpath -o "$RUNNER_TEMP/gooo-proof-aware-test-reuse-bin" ./cmd/gooo-proof-aware-test-reuse
      - name: Run Go tests and record test events
        shell: bash
        run: scripts/measure-stage.sh test "$RUNNER_TEMP/stage-metrics/test.json" bash -c 'set -o pipefail; go test -json ./... | tee "$RUNNER_TEMP/go-test-events.jsonl"'
      - name: Run fixed nine-case semantic denominator and matched pair
        shell: bash
        run: CONFORMANCE_WORK_ROOT="$RUNNER_TEMP/conformance-work" CONFORMANCE_COUNTS_OUT="$RUNNER_TEMP/conformance-counts.json" REUSE_PAIR_OUT="$RUNNER_TEMP/reuse-pair.json" scripts/measure-stage.sh conformance "$RUNNER_TEMP/stage-metrics/conformance.json" scripts/conformance.sh "$RUNNER_TEMP/gooo-proof-aware-test-reuse-bin"
      - name: Run caller-owned end-to-end integration
        shell: bash
        run: INTEGRATION_RESULT_OUT="$RUNNER_TEMP/integration-result.json" scripts/measure-stage.sh integration "$RUNNER_TEMP/stage-metrics/integration.json" scripts/integration.sh "$RUNNER_TEMP/gooo-proof-aware-test-reuse-bin"
      - name: Assemble machine evidence
        env:
          CONFORMANCE_WORK_ROOT: ${{ runner.temp }}/conformance-work
        run: scripts/assemble-ci-evidence.sh "$RUNNER_TEMP/stage-metrics" "$RUNNER_TEMP/go-test-events.jsonl" "$RUNNER_TEMP/conformance-counts.json" "$RUNNER_TEMP/integration-result.json" "$RUNNER_TEMP/reuse-pair.json" "$RUNNER_TEMP/ci-evidence.json"
      - name: Upload machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-proof-aware-test-reuse-ci-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error
